name: Gleam dependencies
description: >-
  Install the pinned toolchain and fetch every dependency the workspace and its
  fixtures lock, out of a cache wherever one is warm.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        version: 2026.10.22
        install: true
        cache: true
    # The cache holds the user-wide Gleam package store that manifests pin.
    # A hit skips Hex entirely, so its per-address rate limit cannot fail CI.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/gleam
          ~/Library/Caches/gleam
          ~/AppData/Local/gleam
        key: >-
          gleam-hex-${{ runner.os }}-${{ hashFiles('manifest.toml',
          'fixtures/*/manifest.toml') }}
        restore-keys: |
          gleam-hex-${{ runner.os }}-
    # The root manifest omits the unitest fixture's dependencies.
    # Fetch them here instead of inside whichever smoke snapshots it first.
    - run: node scripts/deps-download.mjs . fixtures/unitest_project
      shell: bash
