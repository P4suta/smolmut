name = "adaptive_fixture"
version = "0.0.0"

[tools.smolmut]
version = 1

[tools.smolmut.mutation]
operators = ["comparison-boundary"]

[tools.smolmut.test]
target = "erlang"
runtime = "erlang"
timeout_ms = 1000
command = ["node", "adaptive-runner.mjs"]

[tools.smolmut.execution]
jobs = 2
test_selection = "auto"

[tools.smolmut.cache]
mode = "read-write"
key = "fixture"

[tools.smolmut.policy]
strict = false
minimum_score = 100
require_mutants = true

[tools.smolmut.report]
formats = []
history = false
